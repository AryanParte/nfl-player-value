name: Refresh and publish Defense Explorer

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: First release only (fails if a retained Explorer already exists)
        type: boolean
        default: false
  schedule:
    # UTC, after Monday/Thursday games; unrelated to the Codex development timer.
    - cron: '17 16 * * 2,5'

permissions:
  contents: read

concurrency:
  group: explorer-production
  cancel-in-progress: false

env:
  PYTHONPATH: src

jobs:
  build:
    if: github.repository == 'AryanParte/nfl-player-value' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install reviewed tools
        run: |
          python -m pip install --upgrade 'pip==26.2.2'
          python -m pip install '.[model,quality]'
          npm --prefix web ci --ignore-scripts --no-fund
      - name: Offline regression gates
        run: make check
      - name: Restore last retained candidate (not necessarily last deployed)
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        run: |
          args=()
          if [ "$BOOTSTRAP" = "true" ]; then args+=(--bootstrap); fi
          python -m nfl_value.production_cli previous --workspace work/production "${args[@]}"
      - name: Capture sources and build immutable candidate
        id: build
        run: python -m nfl_value.production_cli build --workspace work/production --output artifacts/production
      - name: Restore and recheck the exact deployable bytes
        env:
          ARCHIVE_SHA: ${{ steps.build.outputs.sha256 }}
        run: >-
          python -m nfl_value.production_cli verify --input artifacts/production
          --destination work/build-verified --sha256 "$ARCHIVE_SHA"
          --expected-revision "$GITHUB_SHA" --site artifacts/deployment/site/nfl-player-value
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser check the real restored release (no intercepted data)
        working-directory: web
        run: npx playwright test --config production.config.ts
      - name: Hand off exact candidate to publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: explorer-candidate
          path: artifacts/production/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: explorer-refresh-diagnostics
          path: |
            work/production/readiness.json
            web/production-report/
            web/production-results/
          retention-days: 14

  publish:
    needs: build
    if: github.repository == 'AryanParte/nfl-player-value' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ARCHIVE_SHA: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: explorer-candidate
          path: artifacts/production
      - name: Verify producer, replay, readiness and build site
        run: >-
          python -m nfl_value.production_cli verify --input artifacts/production
          --destination work/publish-verified --sha256 "$ARCHIVE_SHA"
          --expected-revision "$GITHUB_SHA" --site artifacts/deployment/site/nfl-player-value
      - name: Retain immutable release and independently download/replay it
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m nfl_value.production_cli retain --input artifacts/production
          --destination work/remote-download --sha256 "$ARCHIVE_SHA"
          --expected-revision "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts/deployment/site/nfl-player-value
          retention-days: 1
      - name: Final current-time check immediately before requesting deployment
        run: >-
          python -m nfl_value.production_cli verify --input artifacts/production
          --destination work/final-check --sha256 "$ARCHIVE_SHA"
          --expected-revision "$GITHUB_SHA"
      - name: Deploy verified Explorer
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
