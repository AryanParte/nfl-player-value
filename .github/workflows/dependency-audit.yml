name: Optional dependency audit

# Advisory databases need network access; keep this separate from offline PR tests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Bootstrap reviewed installer
        run: python -m pip install --upgrade 'pip==26.2.2'
      - name: Install project and pinned audit tool
        run: |
          python -m pip install -e '.[model,quality]' 'pip-audit==2.10.1'
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          with open("pyproject.toml", "rb") as source:
              requirements = tomllib.load(source)["build-system"]["requires"]
          subprocess.run([sys.executable, "-m", "pip", "install", *requirements], check=True)
          PY
      - name: Record resolved dependency versions
        run: |
          mkdir -p artifacts/dependency-audit
          python -m pip freeze --all > artifacts/dependency-audit/python-resolved.txt
          python -m pip check
      - name: Audit installed dependencies against known advisories
        run: python -m pip_audit --skip-editable --progress-spinner off --format json --output artifacts/dependency-audit/python.json
      - name: Retain audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dependency-audit
          path: artifacts/dependency-audit/
          retention-days: 14

  dashboard-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dashboard dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Audit runtime and development dependencies
        run: |
          mkdir -p artifacts/dependency-audit
          npm --prefix web audit --json > artifacts/dependency-audit/npm.json
      - name: Retain audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-dependency-audit
          path: artifacts/dependency-audit/
          retention-days: 14
