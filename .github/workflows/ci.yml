name: Python contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without runtime dependencies
        run: python -m pip install --no-deps .
      - name: Verify installed package
        working-directory: /tmp
        run: python -c "import nfl_value; print(nfl_value.__version__)"
      - name: Run offline contracts and workflow tests
        run: python -m unittest discover -s tests -v
      - name: Check source syntax and whitespace
        run: |
          python -m compileall -q src scripts tests
          git diff --check
          git show --format= --check HEAD
